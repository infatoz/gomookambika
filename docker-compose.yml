version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Customer PWA (example.com)
  # ----------------------------------------------------------------------------
  customer-pwa:
    build:
      context: .
      dockerfile: docker/customer.Dockerfile
    container_name: gm-customer
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://server:5000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - dokpoly-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.customer.rule=Host(`${DOMAIN_CUSTOMER:-example.com}`)"
      - "traefik.http.routers.customer.entrypoints=websecure"
      - "traefik.http.routers.customer.tls.certresolver=letsencrypt"
      - "traefik.http.services.customer.loadbalancer.server.port=80"

  # ----------------------------------------------------------------------------
  # 2. Driver / Captain PWA (captain.example.com)
  # ----------------------------------------------------------------------------
  driver-pwa:
    build:
      context: .
      dockerfile: docker/driver.Dockerfile
    container_name: gm-driver
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://server:5000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - dokpoly-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.driver.rule=Host(`${DOMAIN_DRIVER:-captain.example.com}`)"
      - "traefik.http.routers.driver.entrypoints=websecure"
      - "traefik.http.routers.driver.tls.certresolver=letsencrypt"
      - "traefik.http.services.driver.loadbalancer.server.port=80"

  # ----------------------------------------------------------------------------
  # 3. Admin Portal PWA (admin.example.com)
  # ----------------------------------------------------------------------------
  admin-pwa:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    container_name: gm-admin
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://server:5000
    depends_on:
      server:
        condition: service_healthy
    networks:
      - dokpoly-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`${DOMAIN_ADMIN:-admin.example.com}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

  # ----------------------------------------------------------------------------
  # 4. Backend Express API Server (api.example.com)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: gm-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/gomookambika}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-replace-in-production-min-32-chars}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super-secret-refresh-jwt-key-replace-in-production}
      - FRONTEND_URLS=https://${DOMAIN_CUSTOMER:-example.com},https://${DOMAIN_DRIVER:-captain.example.com},https://${DOMAIN_ADMIN:-admin.example.com}
      - DEV_OTP_ENABLED=false
    volumes:
      - server_uploads:/app/server/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dokpoly-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=Host(`${DOMAIN_API:-api.example.com}`)"
      - "traefik.http.routers.server.entrypoints=websecure"
      - "traefik.http.routers.server.tls.certresolver=letsencrypt"
      - "traefik.http.services.server.loadbalancer.server.port=5000"

  # ----------------------------------------------------------------------------
  # 5. Database: MongoDB 7.0
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: gm-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=gomookambika
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dokpoly-network

  # ----------------------------------------------------------------------------
  # 6. Cache: Redis 7.2
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: gm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dokpoly-network

volumes:
  mongodb_data:
  redis_data:
  server_uploads:

networks:
  dokpoly-network:
    driver: bridge
