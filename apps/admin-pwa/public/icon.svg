<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D1A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Divine Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.4" />
    </linearGradient>

    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Subtle sacred halo circle behind gopuram -->
  <circle cx="60" cy="46" r="32" fill="#F59E0B" fill-opacity="0.06"/>

  <!-- GOPURAM PINNACLE & TIERS (Temple Architecture) -->
  <g filter="url(#goldShadow)">
    <!-- Top Kalasha Jewel / Sacred Flame -->
    <path d="M60 14 C62 17, 63 20, 60 23 C57 20, 58 17, 60 14 Z" fill="url(#goldGrad)" />
    <circle cx="60" cy="24" r="2.2" fill="#FDE68A" />

    <!-- Tier 1: Top Gopuram Kalash Base & Crown -->
    <path d="M53 27 L67 27 L65 33 L55 33 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M51 32 C54 28, 56 32, 60 29 C64 32, 66 28, 69 32" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round" />

    <!-- Tier 2: Upper Sanctum Chamber -->
    <path d="M49 35 L71 35 L73 44 L47 44 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M57 44 L57 39 C57 37.5, 63 37.5, 63 39 L63 44" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Tier 3: Mid Gopuram Tier -->
    <path d="M44 46 L76 46 L79 57 L41 57 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M55 57 L55 50 C55 48.5, 65 48.5, 65 50 L65 57" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M48 57 L48 52 C48 51, 51 51, 51 52 L51 57" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
    <path d="M72 57 L72 52 C72 51, 69 51, 69 52 L69 57" fill="none" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />

    <!-- Main Temple Gateway Arch (Mahadwara) -->
    <path d="M53 70 L53 60 C53 56, 67 56, 67 60 L67 70" fill="none" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" />
  </g>

  <!-- DYNAMIC HIGHWAY / ROAD (The "Go" Mobility Flow) -->
  <g filter="url(#goldShadow)">
    <!-- Left road curve flowing forward from temple -->
    <path d="M40 59 C44 72, 32 86, 18 104" fill="none" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Right road curve flowing forward with momentum -->
    <path d="M80 59 C78 74, 92 88, 102 104" fill="none" stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Center highway lane dividing stripes -->
    <path d="M60 63 L60 68" fill="none" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round" />
    <path d="M60 73 L60 81" fill="none" stroke="#FDE68A" stroke-width="2.6" stroke-linecap="round" />
    <path d="M60 86 L60 97" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" />
    <path d="M60 102 L60 106" fill="none" stroke="#FDE68A" stroke-width="3.2" stroke-linecap="round" />
  </g>
</svg>
