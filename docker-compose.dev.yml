version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gm-mongodb-dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - gm-dev-network

  redis:
    image: redis:7.2-alpine
    container_name: gm-redis-dev
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    networks:
      - gm-dev-network

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: gm-server-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/gomookambika
      - REDIS_URL=redis://redis:6379
      - DEV_OTP_ENABLED=true
    ports:
      - '5000:5000'
    volumes:
      - ./server/uploads:/app/server/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - gm-dev-network

  customer-pwa:
    build:
      context: .
      dockerfile: docker/customer.Dockerfile
    container_name: gm-customer-dev
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - gm-dev-network

  driver-pwa:
    build:
      context: .
      dockerfile: docker/driver.Dockerfile
    container_name: gm-driver-dev
    ports:
      - '3001:80'
    depends_on:
      - server
    networks:
      - gm-dev-network

  admin-pwa:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    container_name: gm-admin-dev
    ports:
      - '3002:80'
    depends_on:
      - server
    networks:
      - gm-dev-network

volumes:
  mongodb_data_dev:
  redis_data_dev:

networks:
  gm-dev-network:
    driver: bridge
